<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172554"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><title>Disney Trip Savings</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172554;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px}.app{max-width:540px;margin:auto}.card{background:#1e3a8a;border-radius:24px;padding:21px;margin-bottom:16px}h1{margin:0 0 5px}.muted{color:#bfdbfe}label{display:block;margin:13px 0 6px;color:#dbeafe;font-size:14px}input{width:100%;padding:13px;border-radius:12px;border:1px solid #60a5fa;background:#172554;color:white;font-size:17px}button{border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px}.primary{width:100%;margin-top:15px;background:#facc15;color:#422006}.balance{text-align:center;font-size:42px;font-weight:800}.remaining{text-align:center;color:#dbeafe}.progress{height:18px;background:#172554;border-radius:99px;overflow:hidden;margin:20px 0 8px}.bar{height:100%;width:0;background:#facc15;transition:.3s}.percent{text-align:center;color:#fde68a;font-weight:700}.row{display:flex;gap:10px;margin-top:15px}.row button{flex:1}.add{background:#4ade80}.remove{background:#fb923c}.reset{width:100%;margin-top:10px;background:#334155;color:white}.goalrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #3b82f633}
</style></head><body><main class="app">
<div class="card"><h1>🏰 Disney Trip Savings</h1><p class="muted">Save up for your magical trip!</p>
<label>Total trip budget</label><input id="target" type="number" min="0" step=".01" placeholder="2500">
<label>Money you already have</label><input id="saved" type="number" min="0" step=".01" placeholder="0">
<button class="primary" onclick="saveGoal()">✨ Save Trip Goal</button></div>
<div class="card"><div class="balance" id="balance">$0.00</div><div class="remaining" id="remaining">$0.00 left to save</div><div class="progress"><div class="bar" id="bar"></div></div><div class="percent" id="percent">0% saved</div><p id="done" style="text-align:center"></p></div>
<div class="card"><h2>🎟️ Trip Budget</h2>
<div id="rows"></div>
<label>Category budgets (optional)</label>
<div id="inputs"></div><button class="primary" onclick="saveCats()">Save Categories</button></div>
<div class="card"><label>Add or remove money</label><input id="amount" type="number" min="0" step=".01" placeholder="25.00">
<div class="row"><button class="add" onclick="change(1)">＋ Add</button><button class="remove" onclick="change(-1)">− Remove</button></div><button class="reset" onclick="resetApp()">Reset Tracker</button></div>
</main><script>
const names={tickets:"🎟️ Tickets",hotel:"🏨 Hotel",food:"🍔 Food",travel:"✈️ Travel",souvenirs:"🎁 Souvenirs"};
let target=+(localStorage.target||2500),saved=+(localStorage.saved||0),cats=JSON.parse(localStorage.cats||"{}");
const $=id=>document.getElementById(id),money=n=>"$"+(+n||0).toFixed(2);
function setup(){for(const k in names){rows.innerHTML+=`<div class="goalrow"><span>${names[k]}</span><span id="${k}">$0.00</span></div>`;inputs.innerHTML+=`<input id="${k}In" type="number" min="0" placeholder="${names[k].replace(/^\S+ /,'')}" style="margin-top:8px">`}}
function render(){target.value=target;saved.value=saved;let p=target?Math.min(100,saved/target*100):0,left=Math.max(0,target-saved);balance.textContent=money(saved);remaining.textContent=left?money(left)+" left to save":"Trip goal reached!";bar.style.width=p+"%";percent.textContent=p.toFixed(0)+"% saved";done.textContent=p>=100?"🎉 DISNEY TRIP GOAL REACHED! 🏰✨":"";for(const k in names){$(k).textContent=money(cats[k]);$(k+"In").value=cats[k]||""}}
function saveGoal(){target=Math.max(0,+$("target").value||0);saved=Math.max(0,+$("saved").value||0);localStorage.target=target;localStorage.saved=saved;render()}
function change(s){let a=Math.max(0,+amount.value||0);if(!a)return;saved=Math.max(0,saved+s*a);localStorage.saved=saved;amount.value="";render()}
function saveCats(){for(const k in names)cats[k]=Math.max(0,+$(k+"In").value||0);localStorage.cats=JSON.stringify(cats);render()}
function resetApp(){if(confirm("Reset your Disney savings tracker?")){localStorage.clear();target=2500;saved=0;cats={};render()}}
setup();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");render();
</script></body></html>
